appId: org.librecord.app
productName: Librecord
executableName: librecord
copyright: Copyright © Librecord contributors
artifactName: Librecord-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - static/**/*
  - resources/**/*
  - package.json
asar: true
publish:
  provider: github
  releaseType: draft
protocols:
  - name: Librecord
    schemes:
      - librecord
mac:
  category: public.app-category.social-networking
  icon: resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  darkModeSupport: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Librecord uses the microphone for voice chat and calls.
    NSCameraUsageDescription: Librecord uses the camera for video calls.
    NSAudioCaptureUsageDescription: Librecord shares your computer's audio when you stream your screen.
    NSScreenCaptureUsageDescription: Librecord shares your screen when you go live.
    NSAppleEventsUsageDescription: Librecord reads the song playing in Spotify to show it on your profile.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
dmg:
  title: Librecord
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Librecord
  uninstallDisplayName: Librecord
linux:
  icon: resources/icon.png
  category: Network;InstantMessaging;Chat
  maintainer: Librecord contributors
  synopsis: Librecord desktop app
  desktop:
    entry:
      Name: Librecord
      StartupWMClass: Librecord
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: pacman
      arch: [x64, arm64]
